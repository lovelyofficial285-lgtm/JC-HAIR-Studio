<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="JC Hair Studio logo">
  <!-- JC Hair Studio — beige marble square with white JC monogram.
       NOTE: replace this file with the supplied logo.png if available
       and update the references in index.html (assets/logo.png). -->
  <defs>
    <!-- Subtle marble texture -->
    <filter id="marble" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.011 0.017" numOctaves="3" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.78  0 0 0 0 0.66  0 0 0 0 0.55  0 0 0 0.16 0" result="veins"/>
      <feComposite in="veins" in2="SourceGraphic" operator="atop"/>
    </filter>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#B8917B" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <!-- Marble square -->
  <rect x="16" y="16" width="480" height="480" rx="72" fill="#EBD9CC" filter="url(#marble)"/>
  <rect x="16" y="16" width="480" height="480" rx="72" fill="url(#sheen)"/>
  <rect x="36" y="36" width="440" height="440" rx="58" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3"/>

  <!-- JC monogram -->
  <text x="256" y="292" text-anchor="middle" font-family="'Playfair Display', Georgia, 'Times New Roman', serif"
        font-size="196" font-weight="700" fill="#FFFFFF" letter-spacing="6">JC</text>

  <!-- Divider + scissors line icon -->
  <line x1="150" y1="330" x2="362" y2="330" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="2"/>
  <g transform="translate(256 330)" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" fill="none">
    <circle cx="-15" cy="14" r="10"/>
    <circle cx="15" cy="14" r="10"/>
    <line x1="-8" y1="7" x2="13" y2="-15"/>
    <line x1="8" y1="7" x2="-13" y2="-15"/>
  </g>

  <!-- HAIR STUDIO -->
  <text x="256" y="394" text-anchor="middle" font-family="'Poppins', 'Segoe UI', Arial, sans-serif"
        font-size="34" font-weight="500" fill="#FFFFFF" letter-spacing="14">HAIR STUDIO</text>
</svg>
